<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090B10" />
  <title>AutoTrack</title>
  <meta name="description" content="AutoTrack — vehicle telemetry and shared garage." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090B10'/%3E%3Cpath d='M14 40a18 18 0 1 1 36 0' fill='none' stroke='%2322D3EE' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 40l10-11' fill='none' stroke='%2322D3EE' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #090b10;
      --surface: #131722;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f5f7fa;
      --muted: #8b93a7;
      --cyan: #22d3ee;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(34, 211, 238, 0.12), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(440px, 100%);
      padding: 40px 32px;
      text-align: center;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border: 1px solid rgba(34, 211, 238, 0.35);
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.1);
      color: var(--cyan);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    h1 {
      margin: 22px 0 10px;
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .check {
      width: 64px;
      height: 64px;
      margin: 28px auto 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(34, 211, 238, 0.35);
      background: rgba(34, 211, 238, 0.08);
    }

    .check svg {
      width: 28px;
      height: 28px;
      stroke: var(--cyan);
    }

    footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: #5f6678;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">AutoTrack</span>
    <h1>Email verified</h1>
    <p>
      Your email address has been confirmed. Return to the AutoTrack app to continue.
    </p>

    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5l5 5L20 6.5" />
      </svg>
    </div>

    <footer>Vehicle telemetry &amp; shared garage</footer>
  </main>
</body>
</html>
